name: Python tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/project/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/project/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / Python 3.11
            os: Linux
            python: "3.11"
          - label: Ubuntu / Python 3.12
            os: Linux
            python: "3.12"
          - label: Windows / Python 3.12 + browser
            os: Windows
            python: "3.12"
            browser: true
    runs-on: [self-hosted, "${{ matrix.os }}", X64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints-test.txt ".[test]"
      - run: python -m pytest -q
      - name: Browser transcript stability
        if: matrix.browser
        shell: pwsh
        run: ./test-transcript-stability.ps1
