name: Python validation

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/project/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/project/**"
  workflow_dispatch:

concurrency:
  group: python-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-primary:
    name: Linux / native Python 3.12 / full
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare native Python 3.12
        shell: bash
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/codex-room-venv"
          echo "$RUNNER_TEMP/codex-room-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/codex-room-venv/bin/python" -m pip install -c constraints-test.txt ".[test]"
      - name: Full pytest
        shell: bash
        run: |
          tmp_dir="$(mktemp -d /dev/shm/codex-room-pytest.XXXXXX)"
          trap 'rm -rf "$tmp_dir"' EXIT
          TMPDIR="$tmp_dir" python -m pytest -q

  linux-compat:
    name: Linux / Python 3.11 / full
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints-test.txt
      - run: python -m pip install -c constraints-test.txt ".[test]"
      - name: Full pytest
        shell: bash
        run: |
          tmp_dir="$(mktemp -d /dev/shm/codex-room-pytest.XXXXXX)"
          trap 'rm -rf "$tmp_dir"' EXIT
          TMPDIR="$tmp_dir" python -m pytest -q

  windows-fast:
    name: Windows / focused portability + browser
    if: github.event_name != 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-test.txt
      - run: python -m pip install -c constraints-test.txt ".[test]"
      - name: Focused Windows portability pytest
        run: >
          python -m pytest -q
          tests/test_capabilities.py
          tests/test_source_inspection.py
          tests/test_launcher.py
          tests/test_orchestrator.py::test_multiple_retry_warnings_project_to_one_recovered_logical_turn
          tests/test_orchestrator.py::test_retry_exhaustion_is_the_only_terminal_agent_error
      - name: Browser transcript stability
        shell: powershell
        run: ./test-transcript-stability.ps1

  windows-full:
    name: Windows / Python 3.12 / full + browser
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-test.txt
      - run: python -m pip install -c constraints-test.txt ".[test]"
      - name: Full pytest with slow-test report
        run: python -m pytest -q --durations=25
      - name: Browser transcript stability
        shell: powershell
        run: ./test-transcript-stability.ps1
