name: Python tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/project/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/project/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints-test.txt ".[test]"
      - run: timeout 180s python -m pytest -vv --tb=short
