name: Dependency review

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "constraints-test.txt"
      - ".github/workflows/dependency-review.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "constraints-test.txt"
      - ".github/workflows/dependency-review.yml"
  schedule:
    - cron: "17 13 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit pinned dependency set
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit -r constraints-test.txt --strict --no-deps
      - name: Report available dependency updates
        run: |
          python -m pip install -c constraints-test.txt ".[test]"
          python -m pip list --outdated
