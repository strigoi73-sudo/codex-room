name: Verify transaction robustness repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-stale-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/transaction-contract-recovery-20260916
          fetch-depth: 0
      - name: Align history regression with advertised contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_assignment_context.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_history_request_validation_is_bounded() -> None:\n    with pytest.raises(ValidationError, match="SEARCH history retrieval"):\n        HistoryRequest(operation="SEARCH", query="")\n    with pytest.raises(ValidationError, match="query is valid only"):\n        HistoryRequest(operation="RECENT", query="not allowed")\n    with pytest.raises(ValidationError, match="at most 20 requested results"):\n        TransactionDecision(\n            action=TransactionAction.HISTORY,\n            history_requests=[\n                HistoryRequest(operation="RECENT", max_results=10),\n                HistoryRequest(operation="RECENT", max_results=10),\n                HistoryRequest(operation="RECENT", max_results=1),\n            ],\n        )\n'''
          new = '''def test_history_request_validation_is_bounded() -> None:\n    with pytest.raises(ValidationError, match="SEARCH history retrieval"):\n        HistoryRequest(operation="SEARCH", query="")\n    with pytest.raises(ValidationError, match="query is valid only"):\n        HistoryRequest(operation="RECENT", query="not allowed")\n    with pytest.raises(ValidationError, match="less than or equal to 10"):\n        HistoryRequest(operation="RECENT", max_results=11)\n    with pytest.raises(ValidationError, match="at most 4 Room-history requests"):\n        TransactionDecision(\n            action=TransactionAction.HISTORY,\n            history_requests=[\n                HistoryRequest(operation="RECENT", max_results=1)\n                for _ in range(5)\n            ],\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("expected stale history regression block exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Commit regression alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_assignment_context.py
          git commit -m "Align history regression with transaction contract"
          git push origin HEAD:fix/transaction-contract-recovery-20260916

  verify-linux:
    needs: repair-stale-test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/transaction-contract-recovery-20260916
          fetch-depth: 0
      - name: Prepare native Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/codex-room-verify-venv"
          echo "$RUNNER_TEMP/codex-room-verify-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/codex-room-verify-venv/bin/python" -m pip install -c constraints-test.txt ".[test]"
      - name: Record exact verification head
        shell: bash
        run: git rev-parse HEAD
      - name: Check diff whitespace
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
      - name: Run full Python suite
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d /dev/shm/codex-room-verify-pytest.XXXXXX)"
          trap 'rm -rf "$tmp_dir"' EXIT
          TMPDIR="$tmp_dir" python -m pytest -q

  verify-windows:
    needs: repair-stale-test
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/transaction-contract-recovery-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-test.txt
      - run: git rev-parse HEAD
      - run: python -m pip install -c constraints-test.txt ".[test]"
      - name: Run focused Windows transaction and source portability tests
        run: >
          python -m pytest -q
          tests/test_transaction_evidence.py
          tests/test_transactions.py
          tests/test_source_inspection.py
