name: Finalize transaction repair documentation

on:
  push:
    branches:
      - fix/transaction-contract-recovery-20260916

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/transaction-contract-recovery-20260916
          fetch-depth: 0
      - name: Update owning project documents
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_transaction_robustness_fix.py
          git diff --check
      - name: Remove temporary repair machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-transaction-robustness-fix.yml
          rm tools/apply_transaction_robustness_fix.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rmdir tools 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m "Record transaction robustness repair evidence"
          git push origin HEAD:fix/transaction-contract-recovery-20260916
