name: Verify transaction robustness repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare native Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/codex-room-verify-venv"
          echo "$RUNNER_TEMP/codex-room-verify-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/codex-room-verify-venv/bin/python" -m pip install -c constraints-test.txt ".[test]"
      - name: Check diff whitespace
        shell: bash
        run: git diff --check origin/main...HEAD
      - name: Run full Python suite
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d /dev/shm/codex-room-verify-pytest.XXXXXX)"
          trap 'rm -rf "$tmp_dir"' EXIT
          TMPDIR="$tmp_dir" python -m pytest -q

  verify-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-test.txt
      - run: python -m pip install -c constraints-test.txt ".[test]"
      - name: Run focused Windows transaction and source portability tests
        run: >
          python -m pytest -q
          tests/test_transaction_evidence.py
          tests/test_transactions.py
          tests/test_source_inspection.py
